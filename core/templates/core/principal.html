<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReCAR{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background: #1a5490;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .btn-login {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #218838;
        }

        .btn-cadastro {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-cadastro:hover {
            background: #0069d9;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        main {
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header>
        <h1>ReCAR</h1>
        <div class="user-section">
            {% if user.is_authenticated %}
            <div class="user-info">
                <span>👤 {{ user.first_name|default:user.username }}</span>
            </div>
            <a href="{% url 'logout' %}" class="btn-logout">Sair</a>
            {% else %}
            <a href="{% url 'login' %}" class="btn-login">🔐 Login</a>
            <a href="{% url 'cadastro_usuario' %}" class="btn-cadastro">📝 Cadastro</a>
            {% endif %}
        </div>
    </header>

    <div class="container">
        <main>
            {% block content %}
            <h1>Bem-vindo ao ReCAR</h1>
            <p>Sistema de gerenciamento de aluguel de carros. </p>
            {% endblock %}
        </main>
    </div>


</body>

</html>
