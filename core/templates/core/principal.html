<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReCAR{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background: #1a5490;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .btn-login {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #218838;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        main {
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <header>
        <h1>🚗 ReCAR - Sistema de Aluguel de Carros</h1>
        <a href="{% url 'login' %}" class="btn-login">🔐 Login</a>
    </header>

    <div class="container">
        <main>
            {% block content %}
            <h1>Bem-vindo ao ReCAR</h1>
            <p>Sistema de gerenciamento de aluguel de carros. Navegue pelas opções acima para acessar as diferentes
                funcionalidades.</p>
            {% endblock %}
        </main>
    </div>

    <footer>
        <p>&copy; 2025 ReCAR - Todos os direitos reservados</p>
    </footer>
</body>

</html>
