{% extends "core/principal.html" %}
{% block title %}Home - ReCAR{% endblock %}

{% block content %}
<div style="padding:20px;text-align:center">
    <h1></h1>
    <div
        style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));place-items:center;gap:24px;margin-top:24px">
        {% if user.is_staff or user.is_superuser %}
        <div
            style="background:#007BFF;color:#fff;border-radius:12px;padding:24px;min-width:160px;max-width:220px;min-height:120px;display:flex;align-items:center;justify-content:center">
            <h2 style="margin:0"><a href="{% url 'local_listar' %}" style="color:#fff;text-decoration:none">Locais</a>
            </h2>
        </div>
        {% endif %}

        {% if user.is_authenticated %}
        <div
            style="background:#007BFF;color:#fff;border-radius:12px;padding:24px;min-width:160px;max-width:220px;min-height:120px;display:flex;align-items:center;justify-content:center">
            <h2 style="margin:0"><a href="{% url 'disponibilidade' %}"
                    style="color:#fff;text-decoration:none">Disponibilidades</a></h2>
        </div>
        <div
            style="background:#007BFF;color:#fff;border-radius:12px;padding:24px;min-width:160px;max-width:220px;min-height:120px;display:flex;align-items:center;justify-content:center">
            <h2 style="margin:0"><a href="{% url 'minha_reserva_listar' %}"
                    style="color:#fff;text-decoration:none">Minhas Reservas</a></h2>
        </div>
        <div
            style="background:#007BFF;color:#fff;border-radius:12px;padding:24px;min-width:160px;max-width:220px;min-height:120px;display:flex;align-items:center;justify-content:center">
            <h2 style="margin:0"><a href="{% url 'minha_reserva_nova' %}" style="color:#fff;text-decoration:none">Nova
                    Reserva</a></h2>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
