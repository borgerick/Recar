<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cadastro - ReCAR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            color: #555;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        .btn-voltar {
            padding: 10px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
        }

        .btn-voltar:hover {
            background: #5a6268;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Editar Cadastro</h1>
        <form method="POST">
            {% csrf_token %}
            <label>Nome:</label>
            <input type="text" name="nome" value="" required>

            <label>Email:</label>
            <input type="email" name="email" value="" required>

            <label>Telefone:</label>
            <input type="tel" name="telefone" value="">

            <button type="submit">Salvar</button>
            <a href="{% url 'cadastro_listar' %}" class="btn-voltar">Cancelar</a>
        </form>
    </div>
</body>

</html>
